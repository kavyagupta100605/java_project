server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/keybridge?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:Iamhere_123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
